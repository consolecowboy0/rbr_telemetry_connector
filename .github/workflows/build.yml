name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller rbr_telemetry_connector.spec
    
    - name: Create release archive
      run: |
        Compress-Archive -Path dist/rbr_telemetry_connector.exe, config.json, README.md, QUICKSTART.md -DestinationPath rbr_telemetry_connector-windows.zip
      shell: powershell
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: rbr_telemetry_connector-windows
        path: rbr_telemetry_connector-windows.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: rbr_telemetry_connector-windows.zip
        body: |
          ## RBR Telemetry Connector Release
          
          Windows executable build of RBR Telemetry Connector.
          
          ### Installation
          1. Download `rbr_telemetry_connector-windows.zip`
          2. Extract to a folder
          3. Run `rbr_telemetry_connector.exe`
          
          ### Features
          - Real-time telemetry GUI dashboard
          - REST API on port 8080
          - Simulation mode for testing
          
          See README.md and QUICKSTART.md for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
